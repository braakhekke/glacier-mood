name: Refresh history (yearly)
# The page extends history.json live with MeteoSwiss' "recent" files. Once a year, after MeteoSwiss
# moves the old year into its "historical" files, this bakes the new year into history.json.
on:
  schedule:
    - cron: "0 6 15 1 *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy
      - name: Rebuild history.json
        working-directory: scripts
        run: |
          python fetch_history_raw.py
          python build_history.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add history.json
          git diff --staged --quiet || (git commit -m "Refresh station history" && git push)
